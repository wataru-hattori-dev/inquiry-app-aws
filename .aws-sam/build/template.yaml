AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'inquiry-app-aws Serverless Inquiry Form Application (API: Lambda + HTTP
  API + DynamoDB / Frontend: S3 + CloudFront)

  '
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.11
    Architectures:
    - x86_64
Resources:
  InquiriesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: InquiriesTable
      PrimaryKey:
        Name: id
        Type: String
  InquiryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        AllowOrigins:
        - '*'
  CreateInquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateInquiryFunction
      Handler: create_inquiry.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: InquiriesTable
          DYNAMODB_ENDPOINT_URL: ''
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: InquiriesTable
      Events:
        CreateApi:
          Type: HttpApi
          Properties:
            Path: /inquiries
            Method: post
            ApiId:
              Ref: InquiryApi
    Metadata:
      SamResourceId: CreateInquiryFunction
  ListInquiriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListInquiriesFunction
      Handler: list_inquiries.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: InquiriesTable
          DYNAMODB_ENDPOINT_URL: ''
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: InquiriesTable
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            Path: /inquiries
            Method: get
            ApiId:
              Ref: InquiryApi
    Metadata:
      SamResourceId: ListInquiriesFunction
  DeleteInquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DeleteInquiryFunction
      Handler: delete_inquiry.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: InquiriesTable
          DYNAMODB_ENDPOINT_URL: ''
      Policies:
      - Statement:
        - Sid: DynamoDBDeletePolicy
          Effect: Allow
          Action:
          - dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - InquiriesTable
            - Arn
      Events:
        DeleteApi:
          Type: HttpApi
          Properties:
            Path: /inquiries/{id}
            Method: delete
            ApiId:
              Ref: InquiryApi
    Metadata:
      SamResourceId: DeleteInquiryFunction
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowCloudFrontServicePrincipalRead
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-frontend-oac
        Description: OAC for inquiry frontend S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${AWS::StackName} frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
        - Id: FrontendS3Origin
          DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - FrontendOriginAccessControl
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 0
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 0
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for Prod stage (set as VITE_API_BASE_URL)
    Value:
      Fn::Sub: https://${InquiryApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendBucketName:
    Description: S3 bucket for frontend static assets
    Value:
      Ref: FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value:
      Ref: FrontendDistribution
  CloudFrontURL:
    Description: CloudFront HTTPS URL for the frontend
    Value:
      Fn::Sub: https://${FrontendDistribution.DomainName}
