AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  inquiry-app-aws
  Serverless Inquiry Form Application
  (API: Lambda + HTTP API + DynamoDB / Frontend: S3 + CloudFront)

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.11
    Architectures:
      - x86_64

Resources:
  # 1. DynamoDB テーブル定義
  InquiriesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: InquiriesTable
      PrimaryKey:
        Name: id
        Type: String

  # 2. HTTP API Gateway (CORS設定付き)
  InquiryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - "*"

  # 3. 問い合わせ作成用 Lambda (POST)
  CreateInquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: create_inquiry.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref InquiriesTable
          # ローカル: env.local.json で http://host.docker.internal:8000 を指定。本番は未設定のまま。
          DYNAMODB_ENDPOINT_URL: ""
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref InquiriesTable
      Events:
        CreateApi:
          Type: HttpApi
          Properties:
            Path: /inquiries
            Method: post
            ApiId: !Ref InquiryApi

  # 4. 問い合わせ一覧取得用 Lambda (GET)
  ListInquiriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: list_inquiries.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref InquiriesTable
          DYNAMODB_ENDPOINT_URL: ""
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InquiriesTable
      Events:
        ListApi:
          Type: HttpApi
          Properties:
            Path: /inquiries
            Method: get
            ApiId: !Ref InquiryApi

  # 5. 問い合わせ削除用 Lambda (DELETE)
  # NOTE: SAM に DynamoDBDeletePolicy テンプレートは存在しないため、
  #       DeleteItem のみを許可する同等のインラインポリシーを使用する。
  DeleteInquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: delete_inquiry.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref InquiriesTable
          DYNAMODB_ENDPOINT_URL: ""
      Policies:
        - Statement:
            - Sid: DynamoDBDeletePolicy
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt InquiriesTable.Arn
      Events:
        DeleteApi:
          Type: HttpApi
          Properties:
            Path: /inquiries/{id}
            Method: delete
            ApiId: !Ref InquiryApi

  # 6. フロントエンド静的配信 (S3 + CloudFront)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: OAC for inquiry frontend S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} frontend"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL for Prod stage (set as VITE_API_BASE_URL)"
    Value: !Sub "https://${InquiryApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Description: "S3 bucket for frontend static assets"
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: "CloudFront distribution ID"
    Value: !Ref FrontendDistribution
  CloudFrontURL:
    Description: "CloudFront HTTPS URL for the frontend"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
